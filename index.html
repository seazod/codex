<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>飞机弹弓模拟小游戏</title>
  <style>
    :root {
      --bg1: #7ed6ff;
      --bg2: #bff1ff;
      --panel: rgba(255, 255, 255, 0.88);
      --ink: #17435f;
      --accent: #ff9f43;
      --accent2: #ff6b6b;
      --ok: #2ecc71;
      --warn: #f1c40f;
    }

    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; font-family: "Segoe UI", "PingFang SC", sans-serif; }
    body {
      background: linear-gradient(var(--bg1), var(--bg2));
      color: var(--ink);
      touch-action: none;
    }

    .screen {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 16px;
      gap: 12px;
    }

    .screen.active { display: flex; }

    .top-bar {
      width: min(960px, 100%);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      border-radius: 12px;
      background: var(--panel);
      box-shadow: 0 6px 14px rgba(0,0,0,0.15);
      font-weight: 700;
    }

    .panel {
      width: min(960px, 100%);
      background: var(--panel);
      border-radius: 14px;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.15);
      padding: 14px;
    }

    .title { font-size: clamp(22px, 4vw, 34px); margin: 6px 0; text-shadow: 0 2px 0 rgba(255,255,255,.7); }

    /* 主界面的飞机 3D 展示区 */
    .showcase {
      height: 220px;
      perspective: 900px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 12px;
      background: linear-gradient(180deg, #d8f7ff, #a5ddff 70%, #5ecf70 70%, #49b95e 100%);
      position: relative;
      overflow: hidden;
    }

    .cloud {
      position: absolute;
      background: rgba(255,255,255,0.85);
      border-radius: 999px;
      width: 90px;
      height: 36px;
      filter: blur(0.4px);
      animation: cloudMove 12s linear infinite;
    }
    .cloud::before, .cloud::after {
      content: "";
      position: absolute;
      background: inherit;
      border-radius: inherit;
    }
    .cloud::before { width: 44px; height: 44px; left: 11px; top: -20px; }
    .cloud::after { width: 34px; height: 34px; right: 11px; top: -14px; }
    @keyframes cloudMove {
      from { transform: translateX(-180px); }
      to { transform: translateX(calc(100vw + 200px)); }
    }

    .plane {
      width: 240px;
      height: 120px;
      position: relative;
      transform-style: preserve-3d;
      transform: rotateY(-18deg) rotateX(10deg);
      transition: transform .2s;
    }
    .fuselage {
      position: absolute;
      width: 160px;
      height: 30px;
      background: #ffdf6b;
      left: 44px;
      top: 50px;
      border-radius: 40px 60px 45px 34px;
      box-shadow: inset -8px -4px 0 rgba(0,0,0,.15);
    }
    .nose {
      position: absolute;
      width: 42px;
      height: 42px;
      background: #ffa94d;
      border-radius: 50%;
      left: 12px;
      top: 44px;
    }
    .cockpit {
      position: absolute;
      width: 56px;
      height: 20px;
      left: 84px;
      top: 42px;
      background: #7bdff2;
      border-radius: 22px 22px 12px 12px;
      box-shadow: inset -4px -2px 0 rgba(0,0,0,.12);
    }
    .wing {
      position: absolute;
      width: 120px;
      height: 22px;
      border-radius: 60px;
      top: 44px;
      transform-origin: 24px center;
      box-shadow: inset -4px -3px rgba(0,0,0,.15);
    }
    .wing.left { left: 66px; transform: rotate(-14deg) translateZ(18px); }
    .wing.right { left: 66px; top: 62px; transform: rotate(14deg) translateZ(-18px); }
    .tail {
      position: absolute;
      width: 22px;
      height: 30px;
      right: 14px;
      top: 28px;
      border-radius: 6px 8px 3px 3px;
      transform: skew(-10deg);
      box-shadow: inset -3px -2px rgba(0,0,0,.15);
    }
    .tail-wing {
      position: absolute;
      width: 40px;
      height: 12px;
      right: 6px;
      top: 57px;
      border-radius: 8px;
      box-shadow: inset -3px -2px rgba(0,0,0,.15);
    }
    .prop {
      position: absolute;
      left: 3px;
      top: 41px;
      width: 16px;
      height: 48px;
      border-radius: 10px;
      transform-origin: center;
      animation: spin .2s linear infinite;
      box-shadow: 0 0 0 2px rgba(0,0,0,.06) inset;
    }
    @keyframes spin { from { transform: rotate(0); } to { transform: rotate(360deg);} }

    .upgrade-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 10px;
    }

    .upgrade-item {
      border-radius: 10px;
      background: #f6fbff;
      padding: 8px;
      border: 2px solid #d5ecff;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 14px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-weight: 700;
      cursor: pointer;
      background: var(--accent);
      color: white;
      transition: transform .12s, filter .2s;
    }
    button:hover { filter: brightness(1.06); }
    button:active { transform: translateY(1px) scale(.98); }
    button:disabled { background: #bdc3c7; cursor: not-allowed; }

    .big-btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

    /* 游戏场景 */
    .game-world {
      position: relative;
      width: min(960px, 100%);
      height: min(62vh, 460px);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 8px 18px rgba(0,0,0,.2);
      background: linear-gradient(180deg, #8cdcff 0%, #bdefff 60%, #7ddf72 60%, #61c75e 100%);
    }

    .horizon {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 40%;
      background-size: 120px 100%;
      opacity: .9;
    }

    .city { background-image: repeating-linear-gradient(90deg, #4f9ad8 0 20px, #5db3ed 20px 44px, #3d86c0 44px 58px); }
    .forest { background-image: repeating-linear-gradient(90deg, #2c9d4a 0 24px, #39b65a 24px 40px, #24863e 40px 62px); }
    .sea { background-image: repeating-linear-gradient(90deg, #2ea9e0 0 20px, #4dc0f0 20px 46px, #1f92cb 46px 72px); }

    .ground-scroll {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 30%;
      background-image: repeating-linear-gradient(90deg, rgba(255,255,255,.18) 0 8px, rgba(255,255,255,0) 8px 26px);
      animation: run 1s linear infinite;
      opacity: .55;
      pointer-events: none;
    }
    @keyframes run { from { background-position-x: 0; } to { background-position-x: -400px; } }

    .slingshot-zone {
      position: absolute;
      width: 220px;
      height: 220px;
      left: 18px;
      bottom: 18px;
      border-radius: 50%;
      border: 3px dashed rgba(255,255,255,.6);
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,.1);
    }

    .slingshot {
      position: relative;
      width: 84px;
      height: 120px;
    }
    .slingshot::before, .slingshot::after {
      content: "";
      position: absolute;
      width: 14px;
      height: 100px;
      background: #8d5a3a;
      top: 8px;
      border-radius: 8px;
    }
    .slingshot::before { left: 8px; transform: rotate(8deg); }
    .slingshot::after { right: 8px; transform: rotate(-8deg); }
    .band {
      position: absolute;
      left: 18px;
      right: 18px;
      top: 24px;
      height: 6px;
      background: #4b3f33;
      border-radius: 8px;
    }
    .launch-dot {
      position: absolute;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--accent2);
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      transition: transform .06s;
    }

    .hud {
      position: absolute;
      right: 12px;
      top: 12px;
      background: rgba(255,255,255,.86);
      padding: 8px 12px;
      border-radius: 10px;
      font-weight: 700;
    }

    .flight-plane {
      position: absolute;
      left: 220px;
      top: 55%;
      width: 112px;
      height: 52px;
      transform-origin: center;
      filter: drop-shadow(-8px 6px 0 rgba(0,0,0,.16));
      border: 2px solid rgba(255,255,255,.35);
      border-radius: 14px;
      background: rgba(255,255,255,0.08);
    }
    .flight-fuselage {
      position: absolute;
      left: 20px;
      top: 18px;
      width: 78px;
      height: 18px;
      border-radius: 16px 24px 20px 14px;
      background: #ffd166;
    }
    .flight-cockpit {
      position: absolute;
      left: 50px;
      top: 12px;
      width: 26px;
      height: 10px;
      border-radius: 8px;
      background: #7bdff2;
    }
    .flight-wing-main,
    .flight-wing-sub,
    .flight-tail,
    .flight-tail-wing,
    .flight-prop {
      position: absolute;
      border-radius: 12px;
    }
    .flight-wing-main { left: 36px; top: 10px; width: 64px; height: 12px; background: #4cc9f0; transform: rotate(-14deg); }
    .flight-wing-sub { left: 36px; top: 30px; width: 64px; height: 12px; background: #4cc9f0; transform: rotate(14deg); }
    .flight-tail { left: 90px; top: 6px; width: 12px; height: 18px; background: #6c5ce7; }
    .flight-tail-wing { left: 86px; top: 34px; width: 24px; height: 8px; background: #6c5ce7; }
    .flight-prop { left: 8px; top: 14px; width: 8px; height: 26px; background: #adb5bd; animation: spin .15s linear infinite; }

    .tip {
      width: min(960px,100%);
      text-align: center;
      font-size: 14px;
      color: #0f4c6e;
      font-weight: 600;
    }

    .stats { font-size: 18px; font-weight: 800; text-align: center; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <!-- 主界面 -->
  <section id="mainScreen" class="screen active">
    <h1 class="title">✈️ 飞机弹弓高手</h1>
    <div class="top-bar">
      <div>金币：<span id="goldText">0</span> 🪙</div>
      <div>历史最远：<span id="bestText">0</span> m</div>
    </div>

    <div class="panel showcase">
      <div class="cloud" style="top:22px; left:-80px; animation-delay:0s"></div>
      <div class="cloud" style="top:64px; left:-220px; animation-delay:-5s"></div>
      <div id="showcasePlane" class="plane">
        <div class="nose"></div>
        <div class="fuselage"></div>
        <div class="cockpit"></div>
        <div id="wingLeft" class="wing left"></div>
        <div id="wingRight" class="wing right"></div>
        <div id="tail" class="tail"></div>
        <div id="tailWing" class="tail-wing"></div>
        <div id="prop" class="prop"></div>
      </div>
    </div>

    <div class="panel">
      <h3>升级机体（每 5 级解锁新外观）</h3>
      <div id="upgradeGrid" class="upgrade-grid"></div>
    </div>

    <div class="big-btns">
      <button id="startBtn">开始飞行</button>
      <button id="resetBtn" style="background:#7f8c8d">重置存档</button>
    </div>
  </section>

  <!-- 游戏界面 -->
  <section id="gameScreen" class="screen">
    <h2 class="title">发射并飞得更远！</h2>
    <div class="game-world" id="world">
      <div id="horizon" class="horizon city"></div>
      <div class="ground-scroll" id="groundScroll"></div>
      <div class="hud">距离：<span id="distanceText">0</span> m</div>
      <div id="flightPlane" class="flight-plane hidden">
        <div class="flight-fuselage"></div>
        <div class="flight-cockpit"></div>
        <div id="flightWingMain" class="flight-wing-main"></div>
        <div id="flightWingSub" class="flight-wing-sub"></div>
        <div id="flightTail" class="flight-tail"></div>
        <div id="flightTailWing" class="flight-tail-wing"></div>
        <div id="flightProp" class="flight-prop"></div>
      </div>

      <div class="slingshot-zone" id="slingshotZone">
        <div class="slingshot">
          <div class="band"></div>
          <div class="launch-dot" id="launchDot"></div>
        </div>
      </div>
    </div>
    <div class="tip">操作：按住拖拽弹弓发射；飞行中可滑动或用 WASD 微调姿态（W抬头/S低头/A左调/D右调），避免失速并注意落地。</div>
  </section>

  <!-- 结算界面 -->
  <section id="resultScreen" class="screen">
    <h2 class="title">本局结算</h2>
    <div class="panel stats">
      <p>本次距离：<span id="resultDistance">0</span> m</p>
      <p>历史最远：<span id="resultBest">0</span> m</p>
      <p>获得金币：<span id="resultGold">0</span> 🪙</p>
    </div>
    <div class="big-btns">
      <button id="backBtn">返回主界面</button>
      <button id="againBtn">再来一局</button>
    </div>
  </section>

  <script>
    // ====== 数据与存档 ======
    const STORAGE_KEY = "plane_sling_save_v1";
    const PARTS = [
      { key: "leftWing", name: "左翼", baseCost: 30, effect: "lift" },
      { key: "rightWing", name: "右翼", baseCost: 30, effect: "lift" },
      { key: "tail", name: "尾翼", baseCost: 45, effect: "stability" },
      { key: "propeller", name: "螺旋桨", baseCost: 55, effect: "thrust" },
      { key: "slingshot", name: "弹弓", baseCost: 60, effect: "launch" }
    ];

    const state = {
      gold: 120,
      bestDistance: 0,
      levels: {
        leftWing: 0,
        rightWing: 0,
        tail: 0,
        propeller: 0,
        slingshot: 0
      }
    };

    function load() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      try {
        const parsed = JSON.parse(raw);
        state.gold = parsed.gold ?? state.gold;
        state.bestDistance = parsed.bestDistance ?? state.bestDistance;
        state.levels = { ...state.levels, ...(parsed.levels || {}) };
      } catch (_) {}
    }
    function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

    // ====== DOM 引用 ======
    const screens = {
      main: document.getElementById("mainScreen"),
      game: document.getElementById("gameScreen"),
      result: document.getElementById("resultScreen")
    };

    const goldText = document.getElementById("goldText");
    const bestText = document.getElementById("bestText");
    const upgradeGrid = document.getElementById("upgradeGrid");
    const showcasePlane = document.getElementById("showcasePlane");
    const wingLeft = document.getElementById("wingLeft");
    const wingRight = document.getElementById("wingRight");
    const tailEl = document.getElementById("tail");
    const tailWingEl = document.getElementById("tailWing");
    const propEl = document.getElementById("prop");

    const world = document.getElementById("world");
    const launchDot = document.getElementById("launchDot");
    const slingshotZone = document.getElementById("slingshotZone");
    const flightPlane = document.getElementById("flightPlane");
    const flightWingMain = document.getElementById("flightWingMain");
    const flightWingSub = document.getElementById("flightWingSub");
    const flightTail = document.getElementById("flightTail");
    const flightTailWing = document.getElementById("flightTailWing");
    const flightProp = document.getElementById("flightProp");
    const distanceText = document.getElementById("distanceText");
    const horizon = document.getElementById("horizon");
    const groundScroll = document.getElementById("groundScroll");

    const resultDistance = document.getElementById("resultDistance");
    const resultBest = document.getElementById("resultBest");
    const resultGold = document.getElementById("resultGold");

    document.getElementById("startBtn").addEventListener("click", () => switchScreen("game"));
    document.getElementById("backBtn").addEventListener("click", () => switchScreen("main"));
    document.getElementById("againBtn").addEventListener("click", () => switchScreen("game"));

    document.getElementById("resetBtn").addEventListener("click", () => {
      localStorage.removeItem(STORAGE_KEY);
      location.reload();
    });

    function switchScreen(name) {
      Object.values(screens).forEach(s => s.classList.remove("active"));
      screens[name].classList.add("active");
      if (name === "game") startRound();
      if (name === "main") renderMain();
    }

    // ====== 升级系统 ======
    function getCost(partKey) {
      const part = PARTS.find(p => p.key === partKey);
      const lv = state.levels[partKey];
      return Math.floor(part.baseCost * (1 + lv * 0.45));
    }

    function upgrade(partKey) {
      const cost = getCost(partKey);
      if (state.gold < cost) return;
      state.gold -= cost;
      state.levels[partKey] += 1;
      save();
      renderMain();
    }

    function appearanceColor(level, palette) {
      const tier = Math.floor(level / 5);
      return palette[tier % palette.length];
    }

    function applyAppearance() {
      const leftColor = appearanceColor(state.levels.leftWing, ["#4cc9f0", "#8ac926", "#f72585", "#ff7f50"]);
      const rightColor = appearanceColor(state.levels.rightWing, ["#4cc9f0", "#8ac926", "#f72585", "#ff7f50"]);
      const tailColor = appearanceColor(state.levels.tail, ["#6c5ce7", "#ffd166", "#06d6a0", "#ff595e"]);
      const propColor = appearanceColor(state.levels.propeller, ["#adb5bd", "#ffd43b", "#74c0fc", "#fab005"]);
      wingLeft.style.background = leftColor;
      wingRight.style.background = rightColor;
      tailEl.style.background = tailColor;
      tailWingEl.style.background = tailColor;
      propEl.style.background = propColor;
      flightWingMain.style.background = leftColor;
      flightWingSub.style.background = rightColor;
      flightTail.style.background = tailColor;
      flightTailWing.style.background = tailColor;
      flightProp.style.background = propColor;
      showcasePlane.style.transform = `rotateY(-18deg) rotateX(10deg) rotateZ(${Math.sin(Date.now()/450)*2}deg)`;
    }

    function renderMain() {
      goldText.textContent = state.gold;
      bestText.textContent = state.bestDistance.toFixed(1);
      upgradeGrid.innerHTML = "";
      PARTS.forEach(part => {
        const lv = state.levels[part.key];
        const cost = getCost(part.key);
        const item = document.createElement("div");
        item.className = "upgrade-item";
        item.innerHTML = `
          <strong>${part.name} Lv.${lv}</strong>
          <div>效果：${part.effect === "lift" ? "增加升力" : part.effect === "stability" ? "提升稳定性" : part.effect === "thrust" ? "增强推进" : "提高初速度"}</div>
          <div>下一级：${cost} 金币</div>
          <button ${state.gold < cost ? "disabled" : ""}>升级</button>
        `;
        item.querySelector("button").addEventListener("click", () => upgrade(part.key));
        upgradeGrid.appendChild(item);
      });
      applyAppearance();
    }

    // ====== 飞行逻辑 ======
    const round = {
      launched: false,
      dragging: false,
      dragX: 0,
      dragY: 0,
      // 物理参数
      x: 0,
      alt: 0,
      speed: 0,
      gamma: 0,
      aoa: 0,
      pitch: 0,
      // 滑动/键盘控制
      lastTouchX: 0,
      lastTouchY: 0,
      keyPitchInput: 0,
      engine: 1,
      stallTimer: 0,
      // 分数
      distance: 0,
      startTs: 0,
      rafId: 0
    };

    function calcStats() {
      const liftLv = (state.levels.leftWing + state.levels.rightWing) / 2;
      return {
        launchPower: 11 + state.levels.slingshot * 0.95,
        lift: 0.04 + liftLv * 0.0038,
        stability: 0.14 + state.levels.tail * 0.016,
        thrust: 0.1 + state.levels.propeller * 0.026
      };
    }

    function resetRound() {
      Object.assign(round, {
        launched: false, dragging: false, dragX: 0, dragY: 0,
        x: 0, alt: 20, speed: 0, gamma: -0.04, aoa: 0.04, pitch: 0,
        lastTouchX: 0, lastTouchY: 0,
        keyPitchInput: 0, engine: 1, stallTimer: 0,
        distance: 0, startTs: 0
      });
      flightPlane.classList.add("hidden");
      launchDot.style.transform = "translateX(-50%) translate(0px,0px)";
      distanceText.textContent = "0.0";
      horizon.className = "horizon city";
      groundScroll.style.animationDuration = "1s";
      cancelAnimationFrame(round.rafId);
    }

    function startRound() { resetRound(); }

    // 发射：拖拽弹弓
    slingshotZone.addEventListener("pointerdown", (e) => {
      if (round.launched) return;
      round.dragging = true;
      slingshotZone.setPointerCapture(e.pointerId);
      updateDrag(e);
    });

    slingshotZone.addEventListener("pointermove", (e) => {
      if (!round.dragging || round.launched) return;
      updateDrag(e);
    });

    slingshotZone.addEventListener("pointerup", () => {
      if (!round.dragging || round.launched) return;
      round.dragging = false;
      launchFromDrag();
    });

    function updateDrag(e) {
      const rect = slingshotZone.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      let dx = e.clientX - cx;
      let dy = e.clientY - cy;
      const max = 72;
      const len = Math.hypot(dx, dy);
      if (len > max) {
        dx = dx / len * max;
        dy = dy / len * max;
      }
      round.dragX = dx;
      round.dragY = dy;
      launchDot.style.transform = `translateX(-50%) translate(${dx}px, ${dy}px)`;
    }

    function launchFromDrag() {
      const stats = calcStats();
      const pull = Math.min(1, Math.hypot(round.dragX, round.dragY) / 72);
      const angle = Math.atan2(-round.dragY, -round.dragX || -1);
      const power = stats.launchPower * (0.45 + pull * 0.85);

      round.launched = true;
      round.startTs = performance.now();
      round.x = 0;
      round.alt = 24;
      round.speed = Math.max(8, power * 1.05);
      round.gamma = Math.min(0.65, Math.max(-0.18, Math.sin(angle) * 0.6 + 0.08));
      round.pitch = round.gamma * 1.25;
      round.aoa = round.pitch - round.gamma;
      flightPlane.classList.remove("hidden");

      requestAnimationFrame(loop);
    }

    // 飞行时滑动调姿态（整个 world 区域可滑）
    world.addEventListener("pointerdown", (e) => {
      if (!round.launched) return;
      round.lastTouchX = e.clientX;
      round.lastTouchY = e.clientY;
    });

    world.addEventListener("pointermove", (e) => {
      if (!round.launched || !round.lastTouchX) return;
      const dx = e.clientX - round.lastTouchX;
      const dy = e.clientY - round.lastTouchY;
      // 上滑（dy<0）抬头，下滑低头；左右滑也少量影响
      round.pitch += (-dy * 0.0035) + (dx * 0.0008);
      round.pitch = Math.max(-0.55, Math.min(0.58, round.pitch));
      round.lastTouchX = e.clientX;
      round.lastTouchY = e.clientY;
    });

    world.addEventListener("pointerup", () => {
      round.lastTouchX = 0;
      round.lastTouchY = 0;
    });

    const pressedKeys = new Set();

    document.addEventListener("keydown", (e) => {
      const k = e.key.toLowerCase();
      if (["w", "a", "s", "d"].includes(k)) {
        pressedKeys.add(k);
        e.preventDefault();
      }
    });

    document.addEventListener("keyup", (e) => {
      const k = e.key.toLowerCase();
      if (pressedKeys.has(k)) {
        pressedKeys.delete(k);
        e.preventDefault();
      }
    });

    function updateSceneByDistance(d) {
      if (d < 450) {
        horizon.className = "horizon city";
      } else if (d < 1000) {
        horizon.className = "horizon forest";
      } else {
        horizon.className = "horizon sea";
      }
    }

    function loop(ts) {
      const dt = 1 / 60;
      const stats = calcStats();

      // 简化空气动力学模型：AoA 决定升力与诱导阻力，速度与迎风阻力相关
      const g = 9.8;
      const mass = 1.2;
      const rho = 1.225;
      const wingArea = 1.0 + ((state.levels.leftWing + state.levels.rightWing) * 0.03);

      const wasdInput = (pressedKeys.has("w") ? 1 : 0) - (pressedKeys.has("s") ? 1 : 0)
        + ((pressedKeys.has("a") ? 1 : 0) - (pressedKeys.has("d") ? 1 : 0)) * 0.35;
      round.keyPitchInput = wasdInput;

      round.pitch += round.keyPitchInput * 0.014;
      round.pitch += (-round.pitch) * stats.stability * 0.012;
      round.pitch = Math.max(-0.55, Math.min(0.58, round.pitch));

      round.engine = Math.max(0.22, 1 - (ts - round.startTs) / 36000);
      const thrustForce = (3.2 + stats.thrust * 26) * round.engine;

      round.aoa = round.pitch - round.gamma;
      round.aoa = Math.max(-0.4, Math.min(0.46, round.aoa));

      const stalledNow = round.aoa > 0.3 && round.speed < 9.5;
      round.stallTimer = stalledNow ? round.stallTimer + dt : Math.max(0, round.stallTimer - dt * 2.2);

      const stallFactor = stalledNow ? Math.max(0.35, 1 - round.stallTimer * 1.7) : 1;
      const cl = (0.22 + 3.4 * round.aoa) * stallFactor;
      const cd = 0.03 + 0.34 * cl * cl + (stalledNow ? 0.08 : 0);
      const q = 0.5 * rho * Math.max(0, round.speed) * Math.max(0, round.speed);
      const lift = q * wingArea * cl * (0.72 + stats.lift * 3.6);
      const drag = q * wingArea * cd;

      const accelAlong = (thrustForce - drag - mass * g * Math.sin(round.gamma)) / mass;
      const accelNormal = (lift - mass * g * Math.cos(round.gamma)) / Math.max(0.35, mass * round.speed);

      round.speed = Math.max(1.6, round.speed + accelAlong * dt);
      round.gamma += accelNormal * dt;
      round.gamma = Math.max(-1.05, Math.min(0.78, round.gamma));

      const vx = round.speed * Math.cos(round.gamma);
      const vy = round.speed * Math.sin(round.gamma);

      round.x += vx * dt * 3.2;
      round.alt += vy * dt * 1.8;
      round.distance = Math.max(0, round.x);

      // 机体渲染位置与倾斜
      const sx = 220 + Math.min(420, round.x * 0.2);
      const sy = world.clientHeight * 0.72 - round.alt;
      flightPlane.style.left = `${sx}px`;
      flightPlane.style.top = `${sy}px`;
      flightPlane.style.transform = `rotate(${(round.pitch * 57.3).toFixed(2)}deg)`;

      // 场景变化 + 地面滚动速度
      updateSceneByDistance(round.distance);
      const speedScale = Math.max(0.25, 1.2 - Math.min(1, vx / 35));
      groundScroll.style.animationDuration = `${speedScale.toFixed(2)}s`;

      distanceText.textContent = round.distance.toFixed(1);

      // 失败条件：失速或落地
      const stalled = round.stallTimer > 0.7;
      const hitGround = sy > world.clientHeight - 12 || round.alt <= 0;
      if (stalled || hitGround || round.speed < 1.9) {
        endRound();
        return;
      }

      round.rafId = requestAnimationFrame(loop);
    }

    function endRound() {
      cancelAnimationFrame(round.rafId);
      const gained = Math.floor(round.distance / 9 + calcStats().thrust * 4);
      state.gold += gained;
      state.bestDistance = Math.max(state.bestDistance, round.distance);
      save();

      resultDistance.textContent = round.distance.toFixed(1);
      resultBest.textContent = state.bestDistance.toFixed(1);
      resultGold.textContent = gained;
      switchScreen("result");
    }

    // 初始化
    load();
    renderMain();
    setInterval(applyAppearance, 300);
  </script>
</body>
</html>
